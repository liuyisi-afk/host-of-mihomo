name: Auto Convert hosts to Mihomo

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 00:00 自动更新
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Convert hosts
        run: |
          pip install requests pyyaml
          python convert_hosts.py  # 上面那段脚本
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add mihomo_hosts.yaml
          git commit -m "Auto update hosts for Mihomo" || echo "No changes"
          git push
