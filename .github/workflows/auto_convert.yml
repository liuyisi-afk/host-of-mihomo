name: Auto Convert and Push

on:
  schedule:
    - cron: '0 * * * *'  # 每小时更新
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Convert
        run: |
          pip install pyyaml requests gitpython
          python convert.py  # 就是上面的脚本

      - name: Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git push
